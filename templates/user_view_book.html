{% extends 'base.html' %}

{% block content %}
    <div class="container mt-4">
        <h1 class="text-center mb-4" style="font-family: 'Arial', sans-serif; color: #007bff;">{{ book.name }}</h1>
        <h3 class="text-center mb-2" style="font-family: 'Arial', sans-serif; color: #5a6268;">Author: {{ book.author }}</h3>
        <br>
        <div class="content">
            {% if book.content.endswith('.pdf') %}
                <embed src="{{file_url }}" type="application/pdf" width="100%" height="600px" />
            {% else %}
                <p>{{ book.content }}</p>
            {% endif %}
        </div>
        <br>
        <a href="{{ url_for('user_book_requests') }}" class="btn btn-secondary mt-3">Back to Book Requests</a>
    </div>
{% endblock %}
